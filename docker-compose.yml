services:
  cv:
    image: nginx:alpine
    container_name: cv
    volumes:
      - ./data:/usr/share/nginx/html:ro
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cv.rule=Host(`cv.local.ahrd.net`)"
      - "traefik.http.routers.cv.entrypoints=https"
      - "traefik.http.routers.cv.tls=true"
      - "traefik.http.services.cv.loadbalancer.server.port=80"

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.cv.rule=Host(`cv.local.ahrd.net`,`cv.deinedomain.tld`)"
    #   - "traefik.http.routers.cv.entrypoints=https"
    #   - "traefik.http.routers.cv.tls=true"
    #   - "traefik.http.routers.cv.tls.certresolver=cloudflare"
    #   - "traefik.http.services.cv.loadbalancer.server.port=80"

    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
